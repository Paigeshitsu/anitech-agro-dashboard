{% extends 'base.html' %}
{% load static %}

{% block page_title %}Market Prices{% endblock %}

{% block extra_css %}
<style>
    /* Tab Navigation */
    .market-tabs {
        display: flex;
        background: white;
        border-radius: 12px 12px 0 0;
        box-shadow: var(--at-shadow-sm);
        margin-bottom: 0;
        overflow: hidden;
    }
    .market-tab {
        flex: 1;
        padding: 15px 20px;
        background: none;
        border: none;
        font-weight: 600;
        color: #666;
        cursor: pointer;
        transition: 0.2s;
        font-size: 16px;
        position: relative;
    }
    .market-tab:hover {
        background: #f8f9fa;
        color: #1a472a;
    }
    .market-tab.active {
        color: #1a472a;
        background: #4CAF50;
        color: white;
    }
    .market-tab.active::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: #388E3C;
    }

    /* Tab Content */
    .tab-content {
        display: none;
        background: white;
        border-radius: 0 0 12px 12px;
        box-shadow: var(--at-shadow-sm);
        padding: 25px;
        margin-bottom: 30px;
    }
    .tab-content.active {
        display: block;
    }

    /* Main Layout */
    .market-container {
        border-radius: 12px 12px 0 0;
        padding: 25px;
    }

    /* Rest of styles unchanged */
    .market-header h2 { font-size: 22px; font-weight: 600; color: #333; margin: 0; }
    .market-header p { font-size: 14px; color: #777; margin: 5px 0 0 0; }
    .section-header { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 20px; }
    .controls-wrapper { display: flex; align-items: center; gap: 12px; }
    .trend-filter { padding: 8px 20px; border-radius: 25px; border: 1px solid #ccc; background: white; font-size: 14px; color: #555; cursor: pointer; min-width: 160px; }
    .btn-refresh { background: white; border: 1px solid #777; color: #333; padding: 8px 20px; border-radius: 25px; display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 14px; transition: 0.2s; }
    .btn-refresh:hover { background: #f5f5f5; }
.market-chart-wrapper { background: #f9fdf9; border: 1px solid #e2eee2; border-radius: 12px; padding: 20px; margin-bottom: 30px; height: 400px; max-height: 50vh; } @media (max-width: 768px) { .market-chart-wrapper { height: 300px; } }
.market-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 100%; overflow-x: hidden; }
    @media (max-width: 768px) { .market-grid { grid-template-columns: 1fr; gap: 16px; } }
    .market-card { background: #f9fdf9; border: 1px solid #e2eee2; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; transition: 0.3s; }
    .market-card:hover { box-shadow: 0 5px 15px rgba(0,0,0,0.05); transform: translateY(-2px); }
    .card-top { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
    .crop-icon-box { color: #4CAF50; font-size: 24px; }
    .card-top h4 { margin: 0; font-size: 18px; font-weight: 700; color: #1a472a; }
    .card-price { font-size: 18px; font-weight: 800; color: #333; margin: 0 0 5px 0; }
    .card-trend { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 5px; margin-bottom: 8px; }
    .card-forecast { font-size: 12px; color: #777; margin-bottom: 20px; }
    .card-footer { display: flex; justify-content: space-between; align-items: flex-end; padding-top: 15px; border-top: 1px solid #e2eee2; font-size: 11px; color: #888; }
    .details-link { color: #1a472a; font-weight: 700; text-decoration: underline; cursor: pointer; }

    /* Table styles for prices tab */
    .market-table-container { background: white; border-radius: 12px; overflow: hidden; box-shadow: var(--at-shadow-sm); }
    .market-search { width: 100%; padding: 12px 20px; border: none; border-bottom: 2px solid #eee; font-size: 16px; }
    .market-search:focus { outline: none; border-bottom-color: #4CAF50; }
    .market-table { width: 100%; margin: 0; }
    .market-table th { background: #f8f9fa; font-weight: 600; color: #333; padding: 15px 20px; }
    .market-table td { padding: 15px 20px; border-bottom: 1px solid #eee; }
    .market-table tbody tr:hover { background: #f8f9fa; }
    .price-amount { font-weight: 700; color: #28a745; font-size: 1.1rem; }
</style>
{% endblock %}

{% block content %}
<div class="dashboard-main px-6 py-8 max-w-7xl mx-auto">
<!-- Market Overview -->
<div class="tab-content active">
    <div class="market-container">
        <div class="market-header">
            <h2>Market Prices</h2>
            <p>Live price forecasts and trends</p>
        </div>

        <!-- Controls -->
        <div class="section-header">
            <div class="controls-wrapper">
                <select id="trendFilter" class="trend-filter">
                    <option value="all">All Trends</option>
                    <option value="rising">Rising Prices</option>
                    <option value="falling">Falling Prices</option>
                    <option value="stable">Stable Prices</option>
                </select>
                <button class="btn-refresh" id="refreshBtn">
                    <i class="fa-solid fa-rotate"></i> Refresh
                </button>
            </div>
        </div>

        <!-- Chart -->
        <div class="market-chart-wrapper">
            <canvas id="marketChart"></canvas>
        </div>

        <!-- Grid -->
        <div class="market-grid" id="marketGrid">
            <div style="grid-column: 1/-1; text-align: center; padding: 50px;">
                <i class="fas fa-spinner fa-spin fa-2x mb-3" style="color: #4CAF50;"></i>
                <p>Fetching latest market trends...</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{% static 'js/market.js' %}"></script>
<script>
// Crop translations and ML forecast logic (unchanged)
const cropTranslations = {
    'Rice': {'en': 'Rice', 'tl': 'Palay'},
    'Corn': {'en': 'Corn', 'tl': 'Mais'},
    // ... rest unchanged
};
const currentLang = '{{ lang|default:"en" }}';
let marketChart = null;
let marketData = [];

// Init on load
document.addEventListener('DOMContentLoaded', () => {
    // Load forecast data for Market tab
    fetchMarketPrices();
});

// Rest of JS functions unchanged (fetchMarketPrices, filterMarketPrices, renderMarketGrid, updateChart)
document.getElementById('refreshBtn')?.addEventListener('click', fetchMarketPrices);
document.getElementById('trendFilter')?.addEventListener('change', filterMarketPrices);

async function fetchMarketPrices() {
    // ML forecast API calls (unchanged)
    const CROPS = ["Rice", "Corn", "Eggplant", "Bitter Gourd", "Tomato", "Sweet Potato", "Okra", "Peanut", "Melon", "Watermelon", "Cucumber", "Carrot", "Chili"];
    try {
        const requests = CROPS.map(crop =>
            fetch('/ml/forecast-price/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                body: JSON.stringify({ crop_name: crop })
            }).then(res => res.json())
        );
        marketData = await Promise.all(requests);
        filterMarketPrices();
    } catch (error) {
        console.error("Error:", error);
    }
}

function filterMarketPrices() {
    const trend = document.getElementById('trendFilter')?.value || 'all';
    const filtered = trend === 'all' ? marketData : marketData.filter(i => i.trend === trend);
    renderMarketGrid(filtered);
}

function renderMarketGrid(data) {
    const grid = document.getElementById('marketGrid');
    if (!grid) return;
    grid.innerHTML = '';
    data.forEach(item => {
        const isRising = item.trend === 'rising';
        const color = isRising ? '#28a745' : (item.trend === 'falling' ? '#dc3545' : '#6c757d');
        const icon = isRising ? '📈' : (item.trend === 'falling' ? '📉' : '➖');
        const sign = item.percentage_change >= 0 ? '+' : '';
        const translatedName = cropTranslations[item.crop]?.[currentLang] || item.crop;
        const card = document.createElement('div');
        card.className = 'market-card';
        card.innerHTML = `
            <div class="card-top">
                <div class="crop-icon-box"><img src="{% static 'leaf-icon.png' %}" alt="leaf" style="width:24px;height:24px;"></div>
                <h4>${translatedName}</h4>
            </div>
            <p class="card-price">₱${item.current_price}/kg</p>
            <div class="card-trend" style="color: ${color}">${sign}${item.percentage_change}% (${icon})</div>
            <div class="card-forecast">Forecast: ₱${item.forecast_price}/kg</div>
            <div class="card-footer">
                <div>Last Updated<br>${new Date().toLocaleDateString()}</div>
                <div class="details-link">Details</div>
            </div>
        `;
        grid.appendChild(card);
    });
    updateChart(data);
}

function updateChart(data) {
    const ctx = document.getElementById('marketChart')?.getContext('2d');
    if (!ctx || !data.length) return;
    if (marketChart) marketChart.destroy();
    marketChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: data.map(i => i.crop),
            datasets: [{
                label: "Current Price", data: data.map(i => i.current_price), backgroundColor: '#81c784', borderRadius: 5
            }, {
                label: "Forecast", data: data.map(i => i.forecast_price), backgroundColor: '#64b5f6', borderRadius: 5
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { title: { display: true, text: 'Price Comparison' }, legend: { position: 'top' } },
            scales: { y: { beginAtZero: true }, x: { grid: { display: false } } }
        }
    });
}
</script>
{% endblock %}
